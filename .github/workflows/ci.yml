name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

# Cố ý KHÔNG chạy `next build` ở đây: Vercel đã build mọi push, và build cần
# NEXT_PUBLIC_* nên sẽ phải nhét secret vào CI. Typecheck bắt gần hết lỗi mà
# build bắt được, trong vài chục giây thay vì vài phút.
